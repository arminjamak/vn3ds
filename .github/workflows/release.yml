# Builds the standalone vn3ds-port command for macOS (Apple silicon and Intel)
# and Windows when a version tag is pushed, tests each build (converting a
# game, and the one-line installers against a local server that labels
# everything application/octet-stream), and attaches them to the release:
#   vn3ds-cli-mac-arm64.tar.gz, vn3ds-cli-mac-x64.tar.gz, vn3ds-cli-windows-x64.zip
# (+ .sha256 for each, checked by the installers), and the FFmpeg source the
# builds are made from (GPL). See tools/cli-release/README.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # a test run: builds and tests, publishes nothing

permissions:
  contents: write

jobs:
  engine:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v5
      - name: Portlibs
        run: dkp-pacman -Sy --noconfirm --needed 3ds-dev 3ds-zlib 3ds-libogg 3ds-libvorbisidec
      - name: Leaderboard key (optional repository secret)
        env:
          SECRET_H: ${{ secrets.LEADERBOARD_SECRET_H }}
        run: |
          if [ -n "$SECRET_H" ]; then printf '%s\n' "$SECRET_H" > engine/source/leaderboard_secret.h; fi
      - name: Build vn3ds.3dsx
        # the tag is the version vn3ds compares against /latest to update itself
        run: make -C engine VERSION="$([ "$GITHUB_REF_TYPE" = tag ] && echo "$GITHUB_REF_NAME" || echo dev)"
      - name: Build vn3ds.cia (the HOME Menu app FBI installs)
        run: |
          apt-get update -qq && apt-get install -y -qq g++ unzip git curl >/dev/null
          sh engine/cia/build_cia.sh
      - uses: actions/upload-artifact@v4
        with:
          name: engine
          path: |
            engine/vn3ds.3dsx
            engine/vn3ds.cia

  cli:
    needs: engine
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mac-arm64
            os: macos-15
          - target: mac-x64
            os: macos-15-intel
          - target: windows-x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Python packages
        run: python -m pip install -r tools/cli-release/requirements.txt
      - uses: actions/download-artifact@v5
        with:
          name: engine
          path: engine
      - name: ffmpeg and ffprobe (pinned, checksums verified)
        run: python tools/cli-release/fetch_ffmpeg.py ${{ matrix.target }}
      - name: Build
        run: python tools/cli-release/build_cli.py --target ${{ matrix.target }} --version "${GITHUB_REF_NAME}"
      - name: Smoke test (convert a game)
        run: |
          exe=tools/cli-release/work/package/vn3ds/vn3ds-port
          [ -f "$exe.exe" ] && exe="$exe.exe"
          "$exe" --version
          "$exe" examples/syntax_test --no-detect -o "$RUNNER_TEMP/smoke"
          test -f "$RUNNER_TEMP/smoke/syntax-test/game.bin"

      - name: Installer test server
        run: |
          mkdir -p "$RUNNER_TEMP/www/dl"
          cp tools/install/install.sh tools/install/install.ps1 "$RUNNER_TEMP/www/"
          cp tools/cli-release/dist/vn3ds-cli-* "$RUNNER_TEMP/www/dl/"
          mkdir -p "$RUNNER_TEMP/games"
          cp -R examples/syntax_test "$RUNNER_TEMP/games/Bob's Game (1)"
          nohup python tests/serve_octet.py "$RUNNER_TEMP/www" 8765 > "$RUNNER_TEMP/server.log" 2>&1 &
          sleep 2
          curl -sI http://127.0.0.1:8765/install.ps1 | grep -i content-type

      - name: install.sh (path as Terminal pastes it when dragged in)
        if: runner.os == 'macOS'
        run: |
          export HOME="$RUNNER_TEMP/home" VN3DS_DOWNLOAD_URL=http://127.0.0.1:8765/dl
          mkdir -p "$HOME"
          g="$RUNNER_TEMP/games/Bob\\'s\\ Game\\ \\(1\\)"
          zsh -c "curl -fsSL http://127.0.0.1:8765/install.sh | sh -s -- $g --no-detect -o $RUNNER_TEMP/out-sh"
          test -f "$RUNNER_TEMP/out-sh/bob-s-game-1/game.bin"
          # a second run uses the copy it already has
          zsh -c "curl -fsSL http://127.0.0.1:8765/install.sh | sh -s -- --version"
          test "$(grep -c 'GET /dl/vn3ds-cli-${{ matrix.target }}.tar.gz ' "$RUNNER_TEMP/server.log")" = 1

      - name: install.ps1 in Windows PowerShell 5.1 and PowerShell 7
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:VN3DS_DOWNLOAD_URL = 'http://127.0.0.1:8765/dl'
          $game = Join-Path $env:RUNNER_TEMP "games\Bob's Game (1)"
          $script = Join-Path $env:RUNNER_TEMP 'ps-test.ps1'
          # The documented command, with the dragged path (quoted, as Windows
          # Terminal pastes it, plus a trailing backslash), then proof that
          # the user's session is still open.
          $gq = $game.Replace("'", "''")
          @"
          & ([scriptblock]::Create([Text.Encoding]::UTF8.GetString((iwr -useb http://127.0.0.1:8765/install.ps1).RawContentStream.ToArray()))) '$gq\' --no-detect -o "`$env:RUNNER_TEMP\out-`$(`$PSVersionTable.PSVersion.Major)"
          Write-Host "session still open, exit code `$LASTEXITCODE"
          "@ | Set-Content -Encoding ascii $script
          foreach ($shell in 'powershell', 'pwsh') {
            Write-Host "== $shell"
            & $shell -NoProfile -ExecutionPolicy Bypass -File $script | Tee-Object -Variable out
            if (-not ($out -match 'session still open, exit code 0')) { throw "$shell failed" }
          }
          if (-not (Test-Path "$env:RUNNER_TEMP\out-5\bob-s-game-1\game.bin")) { throw 'no game from 5.1' }
          if (-not (Test-Path "$env:RUNNER_TEMP\out-7\bob-s-game-1\game.bin")) { throw 'no game from 7' }

      - name: For the record - does the shorter irm form survive octet-stream?
        if: runner.os == 'Windows'
        shell: pwsh
        continue-on-error: true
        run: |
          foreach ($shell in 'powershell', 'pwsh') {
            & $shell -NoProfile -Command "`$t = irm http://127.0.0.1:8765/install.ps1; Write-Host ('$shell irm gives ' + `$t.GetType().FullName)"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: tools/cli-release/dist/vn3ds-cli-*

  release:
    needs: cli
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: cli-*
          path: dist
          merge-multiple: true
      # vn3ds itself: FBI installs the .cia (vn3ds.com's QR code goes to
      # link.vn3ds.com/vn3ds.cia, always the newest), and vn3ds updates
      # itself from these two (engine/source/update.h)
      - uses: actions/download-artifact@v5
        with:
          name: engine
          path: dist
      - name: FFmpeg source (the GPL asks for it next to the binaries)
        run: |
          curl -fsSL -o dist/ffmpeg-9.0.2.tar.xz https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz
          curl -fsSL -o dist/ffmpeg-9.0.2.tar.xz.asc https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz.asc
          ls -la dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          One command ports a Ren'Py visual novel to the 3DS and puts it there (SD card or Wi-Fi).

          macOS (Terminal): `curl -fsSL https://arminjamak.github.io/vn3ds/install.sh | sh -s -- ` then drag your game in and press Enter.

          Windows (PowerShell): `& ([scriptblock]::Create([Text.Encoding]::UTF8.GetString((iwr -useb https://arminjamak.github.io/vn3ds/install.ps1).RawContentStream.ToArray()))) ` then drag your game in and press Enter.

          On the 3DS: in FBI, Remote Install > Scan QR Code, and scan the code on vn3ds.com (it installs vn3ds.cia from this release as a HOME Menu app). vn3ds.3dsx is the same app for the Homebrew Launcher. Both update themselves from new releases.

          The downloads bundle FFmpeg 9.0.2 (GPL v3); its source is attached (ffmpeg-9.0.2.tar.xz). See THIRD_PARTY_NOTICES.md inside each download.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "vn3ds $GITHUB_REF_NAME" --notes-file notes.md
